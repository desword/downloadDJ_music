<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ DECK — SoundCloud 下载台</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#171b26;--line:#303544;--text:#f3f3f1;--muted:#a3a8b5;--orange:#ff936d;--green:#a1f0c6;--red:#ff9da3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#512d3d,transparent 40%),radial-gradient(ellipse at 0% 70%,#172e36,transparent 40%),var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}.wrap{max-width:1080px;margin:auto;padding:0 24px 24px}.top{height:54px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}.brand{font-size:15px;font-weight:850;letter-spacing:.16em}.brand span,a{color:var(--orange)}.tag{font-size:10px;color:var(--muted);letter-spacing:.15em}.hero{padding:20px 0 16px;display:flex;align-items:center;justify-content:space-between}.hero h1{font-size:clamp(27px,4vw,42px);letter-spacing:-.05em;line-height:1.1;margin:0}.hero p{margin:6px 0 0;color:var(--muted)}.dog-stage{width:140px;height:108px;flex-shrink:0;position:relative;display:grid;place-items:center}.dog-stage svg{width:140px;height:108px;overflow:visible}.dog-shadow{fill:#05060a;opacity:.38}.dog-arm,.dog-head,.dog-body,.dog-tail,.dog-foot{transform-box:fill-box}.dog-arm{transform-origin:50% 10%}.dog-head{transform-origin:50% 85%}.dog-body{transform-origin:50% 80%}.dog-tail{transform-origin:10% 80%}.dog-foot{transform-origin:50% 0}.dog-stage.dancing .dog-body{animation:dog-groove 1.1s infinite}.dog-stage.dancing .dog-head{animation:dog-head 1.1s infinite}.dog-stage.dancing .dog-left{animation:lock-left 1.1s infinite}.dog-stage.dancing .dog-right{animation:lock-right 1.1s infinite}.dog-stage.dancing .dog-tail{animation:dog-tail .35s ease-in-out infinite alternate}.dog-stage.dancing .dog-foot{animation:dog-foot 1.1s infinite}.dog-stage.dancing .dog-foot.right{animation-delay:.55s}@keyframes dog-groove{0%,100%{transform:translateY(0) rotate(-4deg)}20%,38%{transform:translateY(3px) rotate(7deg)}55%,73%{transform:translateY(-2px) rotate(-7deg)}85%{transform:translateY(2px) rotate(4deg)}}@keyframes dog-head{0%,100%{transform:rotate(5deg)}20%,38%{transform:rotate(-12deg)}55%,73%{transform:rotate(12deg)}85%{transform:rotate(-5deg)}}@keyframes lock-left{0%,10%{transform:rotate(-8deg)}20%,38%{transform:rotate(72deg)}50%,60%{transform:rotate(-30deg)}73%,85%{transform:rotate(50deg)}100%{transform:rotate(-8deg)}}@keyframes lock-right{0%,10%{transform:rotate(10deg)}20%,38%{transform:rotate(-48deg)}50%,60%{transform:rotate(28deg)}73%,85%{transform:rotate(-80deg)}100%{transform:rotate(10deg)}}@keyframes dog-tail{to{transform:rotate(24deg)}}@keyframes dog-foot{0%,100%{transform:translateY(0) rotate(0)}25%,40%{transform:translateY(-3px) rotate(12deg)}65%,80%{transform:translateY(1px) rotate(-9deg)}}@media(prefers-reduced-motion:reduce){.dog-stage.dancing .dog-body,.dog-stage.dancing .dog-head,.dog-stage.dancing .dog-arm,.dog-stage.dancing .dog-tail,.dog-stage.dancing .dog-foot{animation:none}}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:linear-gradient(145deg,#1a1e2a,#12161f);border:1px solid var(--line);border-radius:13px;padding:16px}.full{grid-column:1/-1}.heading{font-size:15px;font-weight:750;margin:0 0 8px}.label{display:block;color:#c7cad2;font-size:12px;font-weight:700;margin:9px 0 5px}textarea,input[type=text]{width:100%;background:#0c1018;border:1px solid #353b4b;border-radius:8px;color:white;padding:9px 11px;outline:none}textarea:focus,input[type=text]:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff81521c}textarea{resize:vertical;min-height:72px}::placeholder{color:#737b89}.controls,.formats,.badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.controls{margin-top:10px}.button{border:1px solid #42495b;border-radius:8px;background:#252a39;color:#f5f5f5;padding:8px 13px;font-size:13px;font-weight:700}.button:hover:not(:disabled){border-color:#a8aabd}.primary{background:var(--orange);border-color:var(--orange);color:#21120f}.ghost{background:transparent}.format{border:1px solid #353b4b;border-radius:8px;padding:6px 11px;cursor:pointer}.format:has(input:checked){border-color:var(--orange)}.format input{accent-color:var(--orange)}.setting-row{display:flex;align-items:end;justify-content:space-between;gap:10px}.setting-row .label{margin-top:8px}.save-msg,.status{color:var(--muted);font-size:12px}.progress-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.progress-head strong{font-size:14px}.progress{height:6px;background:#303443;border-radius:8px;overflow:hidden;margin:10px 0 6px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#ff8152,#ffb07b);transition:width .3s}.status{min-height:18px}.eta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.eta-card{flex:1;min-width:150px;background:#10141d;border:1px solid #303544;border-radius:9px;padding:8px 11px;display:flex;justify-content:space-between;align-items:center;gap:10px}.eta-card span{color:#b4b9c5;font-size:12px}.eta-card strong{color:#ffb194;font-size:14px;font-variant-numeric:tabular-nums}.notice{margin:10px 0 0;padding:9px 11px;border-radius:8px;background:#432a30;color:#ffc0bf;font-size:13px;overflow-wrap:anywhere}.badge{border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;background:#27332e;color:var(--green)}.badge.restricted{background:#40252e;color:#ffadb0}.badge.unknown{background:#403425;color:#f5cd8f}details{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}summary::-webkit-details-marker{display:none}summary:after{content:'展开 +';font-weight:400;color:var(--muted);font-size:12px}details[open]>summary:after{content:'收起 −'}.results{max-height:210px;overflow:auto}.playlist{border-top:1px solid #ffffff12;margin-top:10px;padding-top:8px}.playlist h3{font-size:13px;margin:0 0 4px}.track{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:start;border-top:1px solid #ffffff0b;padding:6px 0}.track-num{color:#858b9a;font-variant-numeric:tabular-nums}.track-name{overflow-wrap:anywhere}.track-state{font-size:12px;color:var(--green);white-space:nowrap}.track-state.restricted{color:var(--red)}.track-state.unknown{color:#f5cd8f}.foot{color:#858b9a;font-size:11px;margin-top:14px}.hidden{display:none!important}@media(max-width:700px){.wrap{padding:0 14px 20px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.hero{padding:16px 0}.dog-stage,.dog-stage svg{width:110px;height:90px}.tag{font-size:9px}}
</style></head><body><main class="wrap">
<header class="top"><div class="brand">◉ DJ <span>DECK</span></div><span class="tag">SOUNDCLOUD / DOWNLOAD STATION</span></header>
<section class="hero"><div><h1>准备好你的下一场。</h1><p>粘贴歌单，开始下载。</p></div><div class="dog-stage" id="dog" role="img" aria-label="戴耳机的小狗"><svg viewBox="0 0 140 120" aria-hidden="true">

<g class="dog-foot right"><path d="M80 93 L81 105 Q76 110 81 111 L98 111 Q102 107 93 103 L94 91" fill="#f4d0a5" stroke="#392a2a" stroke-width="3" stroke-linejoin="round"/><path d="M79 106 Q87 104 96 106 L98 111 L80 111Z" fill="#f28667"/></g>

<g class="dog-arm dog-left"><path d="M53 67 Q44 66 40 74 L34 87 Q32 92 37 95 Q43 96 46 91 L55 80" fill="#f19a79" stroke="#392a2a" stroke-width="3" stroke-linejoin="round"/><path d="M35 86 Q28 86 29 92 Q29 98 36 98 Q42 97 42 92Z" fill="#f4d0a5" stroke="#392a2a" stroke-width="2.5"/></g>
<g class="dog-arm dog-right"><path d="M91 67 Q101 66 105 75 L111 85 Q114 91 109 94 Q103 97 100 91 L91 80" fill="#f19a79" stroke="#392a2a" stroke-width="3" stroke-linejoin="round"/><path d="M106 85 Q113 83 115 89 Q117 95 110 97 Q104 97 102 92Z" fill="#f4d0a5" stroke="#392a2a" stroke-width="2.5"/></g>
<g class="dog-head"><path d="M47 28 Q34 23 32 37 Q29 53 39 57 Q46 59 50 48" fill="#a96843" stroke="#392a2a" stroke-width="3"/><path d="M95 28 Q109 23 112 37 Q115 53 105 57 Q98 59 94 48" fill="#a96843" stroke="#392a2a" stroke-width="3"/><path d="M45 37 Q45 17 72 17 Q99 17 99 37 L97 51 Q94 68 72 69 Q50 68 47 51Z" fill="#f4d0a5" stroke="#392a2a" stroke-width="3"/><path d="M56 19 Q62 14 69 17 L66 34 Q57 35 53 29Z" fill="#bd7a4c"/><path d="M57 43 Q60 40 63 43 M81 43 Q84 40 87 43" fill="none" stroke="#392a2a" stroke-width="3" stroke-linecap="round"/><ellipse cx="53" cy="51" rx="4" ry="2.5" fill="#f1a29b"/><ellipse cx="91" cy="51" rx="4" ry="2.5" fill="#f1a29b"/><path d="M62 54 Q62 47 72 47 Q82 47 82 54 Q80 62 72 62 Q64 62 62 54" fill="#ffead0"/><path d="M67 51 Q72 48 77 51 Q76 56 72 56 Q68 56 67 51Z" fill="#392a2a"/><path d="M72 56 Q72 60 68 60 M72 56 Q72 60 76 60" fill="none" stroke="#392a2a" stroke-width="1.7" stroke-linecap="round"/>
<path d="M43 38 Q40 14 72 13 Q103 14 101 38" fill="none" stroke="#47475f" stroke-width="5"/><rect x="39" y="32" width="9" height="17" rx="4" fill="#f17e66" stroke="#392a2a" stroke-width="2"/><rect x="96" y="32" width="9" height="17" rx="4" fill="#f17e66" stroke="#392a2a" stroke-width="2"/><path d="M54 18 Q71 6 90 18 L89 23 Q72 17 55 23Z" fill="#59475f" stroke="#392a2a" stroke-width="2"/><path d="M84 20 L99 24 Q95 27 85 25Z" fill="#59475f" stroke="#392a2a" stroke-width="2"/></g>
</svg></div></section>
<div class="grid">
<section class="panel"><h2 class="heading">歌单链接</h2><textarea id="urlInput" aria-label="SoundCloud 歌单链接" placeholder="粘贴 SoundCloud 歌单或单曲链接，多个链接用换行或英文分号分隔"></textarea><div class="controls"><button class="button primary" id="startBtn">开始下载 →</button><button class="button ghost" id="cancelBtn" disabled>终止任务</button><span class="save-msg" id="actionStatus" role="status"></span></div></section>
<section class="panel"><h2 class="heading">下载设置</h2><label class="label" for="pathInput">保存位置</label><input type="text" id="pathInput" placeholder="例如 /Users/你的用户名/Music/SoundCloud"><div class="setting-row"><div><span class="label">音频格式</span><div class="formats"><label class="format"><input type="radio" name="format" value="wav" checked> WAV</label><label class="format"><input type="radio" name="format" value="mp3"> MP3</label></div></div><div><button class="button ghost" id="saveBtn">保存默认设置</button> <span class="save-msg" id="saveStatus"></span></div></div></section>
<section class="panel full"><div class="progress-head"><strong id="progressLabel">准备就绪</strong><span class="status" id="progressPercent"></span></div><div class="progress"><div id="progressBar"></div></div><div class="status" id="progressDetail" role="status">扫描后自动下载</div><div class="eta-row hidden" id="etaRow" aria-live="polite"><div class="eta-card"><span>当前歌曲预计剩余</span><strong id="trackEta">计算中</strong></div><div class="eta-card"><span>全部歌曲预计剩余</span><strong id="totalEta">计算中</strong></div></div><div class="controls hidden" id="folderControls"><button class="button ghost" id="openFolderBtn">打开下载目录 ↗</button><span class="save-msg" id="folderStatus" role="status"></span></div><div class="notice hidden" id="alertBox"></div>
<details id="scanDetails" class="hidden"><summary><span>扫描结果 <span id="scanSummary" class="badges"></span></span></summary><div id="scanResults" class="results"></div><div class="controls"><button class="button ghost" id="copyBtn">复制待处理清单</button><span class="save-msg" id="copyStatus"></span></div></details>
<details id="downloadDetails" class="hidden"><summary><span>下载结果 <span id="downloadSummary" class="badges"></span></span></summary><div id="trackResults" class="results"></div></details></section>
</div><footer class="foot">保持页面打开以接收完成提示音</footer></main>
<script>
const $=id=>document.getElementById(id);let timer=null,running=false,latestScan=null,audioContext=null;
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.detail||'请求失败');return data}
function el(tag,cls,value){const n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=value;return n}
function safeLink(url){try{const u=new URL(url);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}
function setRunning(value){running=value;$('startBtn').disabled=value;$('cancelBtn').disabled=!value;if(!value)$('dog').classList.remove('dancing')}
async function loadConfig(){try{const c=await api('/api/config');$('pathInput').value=c.default_download_path||'';document.querySelector(`input[name="format"][value="${c.default_format==='mp3'?'mp3':'wav'}"]`).checked=true}catch(e){$('saveStatus').textContent='加载失败：'+e.message}}
$('saveBtn').onclick=async()=>{try{await api('/api/config','PUT',{default_download_path:$('pathInput').value.trim(),default_format:document.querySelector('input[name=format]:checked').value});$('saveStatus').textContent='已保存'}catch(e){$('saveStatus').textContent=e.message}};
function prepareSound(){try{const C=window.AudioContext||window.webkitAudioContext;if(C){audioContext=audioContext||new C();audioContext.resume().catch(()=>{})}}catch(e){console.warn(e)}}
function playComplete(){if(!audioContext)return;try{const now=audioContext.currentTime;[523.25,659.25,783.99,1046.5].forEach((freq,i)=>{const osc=audioContext.createOscillator(),gain=audioContext.createGain(),t=now+i*.13;osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.12,t+.025);gain.gain.exponentialRampToValueAtTime(.0001,t+.5);osc.connect(gain);gain.connect(audioContext.destination);osc.start(t);osc.stop(t+.52)})}catch(e){console.warn(e)}}
$('startBtn').onclick=async()=>{const url=$('urlInput').value.trim(),download_path=$('pathInput').value.trim();if(!url||!download_path){$('actionStatus').textContent='请填写链接和保存位置';return}prepareSound();setRunning(true);$('actionStatus').textContent='';$('scanDetails').classList.add('hidden');$('downloadDetails').classList.add('hidden');$('alertBox').classList.add('hidden');$('folderControls').classList.add('hidden');$('etaRow').classList.remove('hidden');$('trackEta').textContent='计算中';$('totalEta').textContent='计算中';$('folderStatus').textContent='';$('progressLabel').textContent='准备扫描';$('progressDetail').textContent='';$('progressBar').style.width='0%';try{await api('/api/workflow/start','POST',{url,download_path,format:document.querySelector('input[name=format]:checked').value});poll()}catch(e){setRunning(false);$('actionStatus').textContent=e.message}};
$('cancelBtn').onclick=async()=>{try{await api('/api/workflow/cancel','POST');$('cancelBtn').disabled=true;$('actionStatus').textContent='正在停止…'}catch(e){$('actionStatus').textContent=e.message}};
async function poll(){try{const w=await api('/api/workflow/progress');render(w);if(['finished','cancelled','error'].includes(w.status)){setRunning(false);$('actionStatus').textContent='';if(w.status==='finished')playComplete();return}timer=setTimeout(poll,800)}catch(e){$('progressDetail').textContent='连接中断，正在重试…';timer=setTimeout(poll,2000)}}
function formatEta(value){if(typeof value!=='number'||!Number.isFinite(value)||value<0)return '计算中';const seconds=Math.ceil(value),h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),sec=seconds%60;return h?`${h}小时${m}分`:m?`${m}分${sec}秒`:`${sec}秒`}
function render(w){const s=w.scan||{},d=w.download||{};const active=['scanning','downloading','cancelling'].includes(w.status);$('etaRow').classList.toggle('hidden',!active&&w.status!=='finished');$('trackEta').textContent=w.status==='finished'?'已完成':formatEta(w.status==='downloading'?d.track_eta_seconds:null);$('totalEta').textContent=w.status==='finished'?'已完成':formatEta(w.status==='downloading'?d.total_eta_seconds:null);$('dog').classList.toggle('dancing',w.status==='downloading');$('folderControls').classList.toggle('hidden',w.status!=='finished');if(s.playlists&&s.playlists.length){latestScan=s;renderScan(s)}if(w.status==='scanning'){$('progressLabel').textContent='正在扫描歌单';$('progressPercent').textContent=`${s.checked||0} / ${s.total||0}`;$('progressBar').style.width=s.total?Math.round(s.checked/s.total*100)+'%':'0%';$('progressDetail').textContent=s.message||'正在准备…'}else if(w.status==='cancelling'){$('progressLabel').textContent='正在停止';$('progressDetail').textContent='等待当前操作结束…'}else if(w.status==='downloading'){const total=d.total_tracks||1,cur=d.current_track||1,pct=parseFloat(d.percent)||0;$('progressLabel').textContent=d.status==='parsing'?(d.message||'正在准备下载'):`正在下载 ${cur} / ${total}`;$('progressPercent').textContent=d.status==='parsing'?'':d.percent||'0%';$('progressBar').style.width=Math.min(100,Math.max(0,((cur-1)+pct/100)/total*100))+'%';$('progressDetail').textContent=d.current_title||d.message||''}else if(w.status==='finished'){$('progressLabel').textContent='下载任务已结束';$('progressPercent').textContent='100%';$('progressBar').style.width='100%';$('progressDetail').textContent=`保存位置：${d.download_path||''}`;renderDownloads(d.track_results||[])}else if(w.status==='cancelled'){$('progressLabel').textContent='任务已终止';$('progressDetail').textContent='修改歌单后可再次开始';renderDownloads(d.track_results||[])}else if(w.status==='error'){$('progressLabel').textContent='任务出错';$('progressDetail').textContent=w.error||'请检查网络后重试';renderDownloads(d.track_results||[])}}
function renderScan(s){const all=s.playlists.flatMap(p=>p.tracks),bad=all.filter(t=>t.status==='restricted'),unknown=all.filter(t=>t.status==='unknown'),errors=s.playlists.filter(p=>p.error);$('scanDetails').classList.remove('hidden');const sum=$('scanSummary');sum.replaceChildren();for(const [cls,label,n] of [['available','可提取',all.filter(t=>t.status==='available').length],['restricted','受保护',bad.length],['unknown','待确认',unknown.length]])sum.append(el('span','badge '+cls,`${label} ${n}`));const alert=$('alertBox');alert.classList.toggle('hidden',!bad.length&&!errors.length);if(bad.length||errors.length)alert.textContent=[bad.length?`受保护 ${bad.length} 首：${bad.slice(0,3).map(t=>t.title).join('、')}${bad.length>3?'…':''}`:'',errors.length?`${errors.length} 个歌单扫描失败`:''].filter(Boolean).join(' · ');const root=$('scanResults');root.replaceChildren();for(const p of s.playlists){const section=el('div','playlist');section.append(el('h3','',p.title));if(p.error)section.append(el('p','track-state unknown','扫描失败：'+p.error));for(const t of p.tracks){const row=el('div','track');row.append(el('span','track-num',String(t.index).padStart(2,'0')));const name=el('div','track-name'),url=safeLink(t.url);if(url){const a=el('a','',t.title);a.href=url;a.target='_blank';a.rel='noopener noreferrer';name.append(a)}else name.textContent=t.title;const state=el('span','track-state '+t.status,({available:'可提取',restricted:'受保护',unknown:'待确认'})[t.status]||'待确认');if(t.status!=='available')state.title=t.reason||'';row.append(name,state);section.append(row)}root.append(section)}}
$('copyBtn').onclick=async()=>{if(!latestScan)return;const lines=[];for(const p of latestScan.playlists){if(p.error)lines.push(`${p.title}: ${p.error} ${p.url}`);for(const t of p.tracks.filter(x=>x.status!=='available'))lines.push(`${p.title} #${t.index} ${t.title} — ${t.reason} ${t.url}`)}try{await navigator.clipboard.writeText(lines.join('\n')||'没有待处理的曲目');$('copyStatus').textContent='已复制'}catch{$('copyStatus').textContent='复制失败'}};
$('openFolderBtn').onclick=async()=>{const button=$('openFolderBtn');button.disabled=true;$('folderStatus').textContent='';try{await api('/api/workflow/open-folder','POST')}catch(e){$('folderStatus').textContent=e.message}finally{button.disabled=false}};
function renderDownloads(results){const details=$('downloadDetails');details.classList.toggle('hidden',!results.length);if(!results.length)return;const summary=$('downloadSummary'),root=$('trackResults');summary.replaceChildren();root.replaceChildren();for(const [status,label] of [['ok','已下载'],['skipped','已存在'],['failed','失败']])summary.append(el('span','badge '+(status==='failed'?'unknown':''),`${label} ${results.filter(r=>r.status===status).length}`));for(const r of results){const row=el('div','track');row.append(el('span','track-num',String(r.index).padStart(2,'0')),el('span','track-name',(r.playlist_title?r.playlist_title+' · ':'')+r.title),el('span','track-state '+(r.status==='failed'?'unknown':''),({ok:'完成',skipped:'已存在',failed:'下载失败',pending:'未完成'})[r.status]||r.status));root.append(row)}}
loadConfig();api('/api/workflow/progress').then(w=>{if(['scanning','downloading','cancelling'].includes(w.status)){setRunning(true);poll()}else if(w.status!=='idle')render(w)}).catch(()=>{});
</script></body></html>
