<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundCloud 歌单下载器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 16px; height: 16px;
            display: inline-block;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress-bar-fill { transition: width 0.3s ease; }
        /* 解析阶段的不定进度动画 */
        @keyframes indeterminate {
            0% { left: -40%; width: 40%; }
            50% { left: 30%; width: 50%; }
            100% { left: 100%; width: 40%; }
        }
        .progress-bar-indeterminate {
            position: absolute; height: 100%;
            background: #f97316; border-radius: 9999px;
            animation: indeterminate 1.2s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div class="max-w-3xl mx-auto px-4 py-8">

        <!-- 标题栏 -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-orange-400">🎵 SoundCloud 歌单下载器</h1>
            <p class="text-slate-400 mt-2">基于 yt-dlp，支持批量下载歌单为 wav / mp3</p>
        </header>

        <!-- 歌单链接输入区 -->
        <section class="bg-slate-800 rounded-xl p-5 mb-5 shadow-lg">
            <label class="block text-sm font-medium text-slate-300 mb-2">歌单链接</label>
            <textarea id="urlInput" rows="3"
                placeholder="请输入 SoundCloud 歌单链接，多个歌单可用英文分号 ; 或换行分隔"
                class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500 placeholder-slate-500 resize-y"></textarea>
        </section>

        <!-- 下载配置区 -->
        <section class="bg-slate-800 rounded-xl p-5 mb-5 shadow-lg">
            <h2 class="text-lg font-semibold text-slate-200 mb-3">下载配置</h2>
            <div class="mb-3">
                <label class="block text-sm font-medium text-slate-300 mb-1">下载路径</label>
                <input id="pathInput" type="text"
                    placeholder="例如 /Users/你的用户名/Music/SoundCloud"
                    class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500 placeholder-slate-500" />
            </div>
            <div class="flex items-center gap-4 mb-3">
                <label class="text-sm font-medium text-slate-300">音频格式</label>
                <label class="inline-flex items-center gap-1 cursor-pointer">
                    <input type="radio" name="format" value="wav" checked class="accent-orange-500" />
                    <span>WAV（默认）</span>
                </label>
                <label class="inline-flex items-center gap-1 cursor-pointer">
                    <input type="radio" name="format" value="mp3" class="accent-orange-500" />
                    <span>MP3</span>
                </label>
            </div>
            <button onclick="saveDefaultConfig()"
                class="text-sm bg-slate-600 hover:bg-slate-500 text-white rounded-lg px-4 py-1.5 transition">
                保存为默认配置
            </button>
            <span id="saveCfgMsg" class="text-sm text-green-400 ml-3 hidden">已保存</span>
        </section>

        <!-- 操作区 -->
        <section class="flex gap-3 mb-5">
            <button id="startBtn" onclick="startDownload()"
                class="flex-1 bg-green-600 hover:bg-green-700 disabled:bg-slate-600 text-white font-semibold rounded-lg px-4 py-3 transition">
                开始下载
            </button>
            <button id="cancelBtn" onclick="cancelDownload()" disabled
                class="flex-1 bg-red-600 hover:bg-red-700 disabled:bg-slate-600 text-white font-semibold rounded-lg px-4 py-3 transition">
                取消下载
            </button>
        </section>

        <!-- 进度区 -->
        <section id="progressSection" class="bg-slate-800 rounded-xl p-5 shadow-lg hidden">
            <div class="flex justify-between text-sm text-slate-300 mb-2">
                <span id="progressLabel">准备中...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-slate-700 rounded-full h-4 overflow-hidden relative">
                <div id="progressBar" class="progress-bar-fill bg-orange-500 h-4 rounded-full" style="width:0%"></div>
            </div>
            <p id="progressDetail" class="text-slate-400 text-sm mt-3"></p>
            <!-- 曲目结果列表 -->
            <div id="trackResults" class="mt-4 hidden"></div>
        </section>

        <footer class="text-center text-slate-500 text-xs mt-10">
            文件保存于下载路径下的歌单名子目录
        </footer>
    </div>

<script>
const API = '';
let progressTimer = null;

function setBtnLoading(btn, loading, text) {
    if (loading) {
        btn.dataset.originText = btn.innerText;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>';
    } else {
        btn.disabled = false;
        btn.innerText = text || btn.dataset.originText || btn.innerText;
    }
}

// 加载默认配置
async function loadConfig() {
    try {
        const res = await fetch(API + '/api/config');
        const cfg = await res.json();
        document.getElementById('pathInput').value = cfg.default_download_path || '';
        if (cfg.default_format === 'mp3') {
            document.querySelector('input[name="format"][value="mp3"]').checked = true;
        } else {
            document.querySelector('input[name="format"][value="wav"]').checked = true;
        }
    } catch (e) {
        console.error('加载配置失败', e);
    }
}

// 保存为默认配置
async function saveDefaultConfig() {
    const path = document.getElementById('pathInput').value.trim();
    const format = document.querySelector('input[name="format"]:checked').value;
    try {
        await fetch(API + '/api/config', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                default_download_path: path,
                default_format: format,
            }),
        });
        const msg = document.getElementById('saveCfgMsg');
        msg.classList.remove('hidden');
        setTimeout(() => msg.classList.add('hidden'), 2000);
    } catch (e) {
        alert('保存失败: ' + e);
    }
}

// 开始下载
async function startDownload() {
    const url = document.getElementById('urlInput').value.trim();
    const download_path = document.getElementById('pathInput').value.trim();
    const format = document.querySelector('input[name="format"]:checked').value;
    if (!url) { alert('请输入歌单链接'); return; }
    if (!download_path) { alert('请填写下载路径'); return; }

    const startBtn = document.getElementById('startBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    startBtn.disabled = true;
    cancelBtn.disabled = false;

    try {
        const res = await fetch(API + '/api/download/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url, download_path, format }),
        });
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || '启动下载失败');
        }
        document.getElementById('progressSection').classList.remove('hidden');
        document.getElementById('trackResults').classList.add('hidden');
        startProgressPolling();
    } catch (e) {
        alert(e.message);
        startBtn.disabled = false;
        cancelBtn.disabled = true;
    }
}

async function cancelDownload() {
    if (!confirm('确定取消当前下载？')) return;
    await fetch(API + '/api/download/cancel', { method: 'POST' });
}

function startProgressPolling() {
    if (progressTimer) clearInterval(progressTimer);
    updateProgress();
    progressTimer = setInterval(updateProgress, 1000);
}

async function updateProgress() {
    try {
        const res = await fetch(API + '/api/download/progress');
        const s = await res.json();
        renderProgress(s);
        if (['finished', 'error', 'cancelled'].includes(s.status)) {
            clearInterval(progressTimer);
            progressTimer = null;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('cancelBtn').disabled = true;
        }
    } catch (e) {
        console.error('查询进度失败', e);
    }
}

function renderProgress(s) {
    const bar = document.getElementById('progressBar');
    const pctEl = document.getElementById('progressPercent');
    const label = document.getElementById('progressLabel');
    const detail = document.getElementById('progressDetail');
    const container = bar.parentElement;

    // 多歌单前缀：如 "歌单 1/3 · afro · "
    const plTotal = s.playlist_total > 0 ? s.playlist_total : 1;
    const plIdx = s.playlist_index > 0 ? s.playlist_index : 1;
    const plTitle = s.playlist_title || '';
    const plPrefix = plTotal > 1
        ? `歌单 ${plIdx}/${plTotal} · ${plTitle} · `
        : (plTitle ? `${plTitle} · ` : '');

    if (s.status === 'parsing') {
        // 解析阶段（flat 模式，通常 1-2 秒）：不定进度动画 + 明确文案
        bar.style.width = '100%';
        bar.classList.add('hidden');
        const old = container.querySelector('.progress-bar-indeterminate');
        if (old) old.remove();
        const ind = document.createElement('div');
        ind.className = 'progress-bar-indeterminate';
        container.appendChild(ind);
        pctEl.textContent = '解析中';
        label.textContent = s.message || '正在获取歌单信息...';
        detail.textContent = '正在从 SoundCloud 获取曲目列表，通常 1-2 秒';
        return;
    }

    // 非解析阶段：移除不定动画条，恢复普通进度条
    const ind = container.querySelector('.progress-bar-indeterminate');
    if (ind) ind.remove();
    bar.classList.remove('hidden');

    // 计算当前歌单整体进度：已完成曲目数 + 当前首的下载百分比
    const total = s.total_tracks > 0 ? s.total_tracks : 1;
    const cur = s.current_track > 0 ? s.current_track : 1;
    let curPct = 0;
    const m = String(s.percent || '').match(/([\d.]+)/);
    if (m) curPct = parseFloat(m[1]);
    const overall = ((cur - 1) + curPct / 100) / total * 100;
    const overallClamped = Math.min(100, Math.max(0, overall));

    bar.style.width = overallClamped.toFixed(1) + '%';
    pctEl.textContent = overallClamped.toFixed(1) + '%';

    if (s.status === 'downloading') {
        let lblText = `${plPrefix}正在下载第 ${cur} / ${total} 首（当前首 ${s.percent || '0%'}）`;
        if (s.eta) {
            lblText += `  ·  预计剩余 ${s.eta}`;
        }
        label.textContent = lblText;
        detail.textContent = `当前曲目：${s.current_title || ''}`;
    } else if (s.status === 'finished') {
        bar.style.width = '100%';
        pctEl.textContent = '100%';
        label.textContent = '下载完成！';
        if (plTotal > 1) {
            detail.textContent = `共 ${plTotal} 个歌单已全部下载完成，保存在：${s.download_path}`;
        } else {
            detail.textContent = `文件保存在：${s.download_path}\\${s.playlist_title}`;
        }
        // 显示曲目结果
        renderTrackResults(s.track_results || []);
    } else if (s.status === 'cancelled') {
        label.textContent = '已取消下载';
        const done = cur - 1 > 0 ? cur - 1 : 0;
        detail.textContent = `${plPrefix}已完成 ${done} / ${total} 首`;
    } else if (s.status === 'error') {
        label.textContent = '下载出错';
        detail.textContent = s.error || '未知错误';
        bar.classList.remove('bg-orange-500');
        bar.classList.add('bg-red-500');
    }
}

function renderTrackResults(results) {
    const container = document.getElementById('trackResults');
    if (!results || results.length === 0) {
        container.classList.add('hidden');
        return;
    }
    container.classList.remove('hidden');
    
    const okCount = results.filter(r => r.status === 'ok').length;
    const skippedCount = results.filter(r => r.status === 'skipped').length;
    const failedCount = results.filter(r => r.status === 'failed').length;
    
    let html = '<div class="border-t border-slate-600 pt-3 mt-3">';
    html += `<div class="text-sm text-slate-300 mb-2">`;
    html += `<span class="text-green-400">已下载 ${okCount}</span>`;
    if (skippedCount > 0) html += ` · <span class="text-yellow-400">已跳过 ${skippedCount}</span>`;
    if (failedCount > 0) html += ` · <span class="text-red-400">无法下载 ${failedCount}</span>`;
    html += `</div>`;
    html += '<div class="max-h-80 overflow-y-auto space-y-1">';
    
    // 分开显示：先显示无法下载清单，再显示完整列表
    const failed = results.filter(r => r.status === 'failed');
    if (failed.length > 0) {
        html += '<div class="mb-3">';
        html += '<div class="text-sm text-red-400 mb-1 font-semibold">无法下载（版权/DRM保护）：</div>';
        html += '<div class="space-y-1 pl-2">';
        for (const r of failed) {
            html += `<div class="text-xs text-red-400">${r.index}. ${r.title}</div>`;
        }
        html += '</div></div>';
    }
    
    html += '<div>';
    html += '<div class="text-sm text-slate-300 mb-1">完整曲目列表：</div>';
    html += '<div class="space-y-1">';
    for (const r of results) {
        let icon = '';
        let rowClass = '';
        if (r.status === 'ok') {
            icon = '✓';
            rowClass = 'text-green-400';
        } else if (r.status === 'skipped') {
            icon = '−';
            rowClass = 'text-yellow-400';
        } else if (r.status === 'failed') {
            icon = '✗';
            rowClass = 'text-red-400';
        } else {
            icon = '?';
            rowClass = 'text-slate-500';
        }
        const reason = r.reason ? ` (${r.reason})` : '';
        html += `<div class="text-xs ${rowClass}">${icon} ${r.index}. ${r.title}${reason}</div>`;
    }
    html += '</div></div>';
    
    html += '</div></div>';
    container.innerHTML = html;
}

window.addEventListener('DOMContentLoaded', loadConfig);
</script>
</body>
</html>
